<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>修复后的 Lottie 小人测试</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .test-controls {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      select,
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 10px;
      }

      button {
        background: #ff6b6b;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background: #ff5252;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .status {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .mascot-test-area {
        position: relative;
        height: 400px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        overflow: hidden;
        border: 2px dashed rgba(255, 255, 255, 0.3);
      }

      .mascot-container {
        position: absolute;
        width: 130px;
        height: 156px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        cursor: pointer;
      }

      .mascot-image {
        width: 100%;
        height: 100%;
        transition: opacity 0.3s;
      }

      .lottie-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .log {
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 10px;
        max-height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.4;
      }

      .log-entry {
        margin-bottom: 5px;
        padding: 2px 0;
      }

      .log-info {
        color: #4caf50;
      }
      .log-warn {
        color: #ff9800;
      }
      .log-error {
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎭 修复后的 Lottie 小人测试</h1>
        <p>测试切换不同角色时的动画播放功能</p>
      </div>

      <div class="test-controls">
        <div class="control-group">
          <label for="characterSelect">选择角色：</label>
          <select id="characterSelect">
            <option value="1">角色 1 (默认)</option>
            <option value="2">角色 2 (夏装)</option>
            <option value="3">角色 3 (冬装)</option>
          </select>
        </div>

        <div class="control-group">
          <button id="playAnimation">播放随机动作</button>
          <button id="checkAnimations">检查可用动画</button>
          <button id="clearCache">清除缓存</button>
        </div>
      </div>

      <div class="status">
        <div>
          <strong>当前角色：</strong> <span id="currentCharacter">1</span>
        </div>
        <div>
          <strong>可用动作：</strong>
          <span id="availableActions">检查中...</span>
        </div>
        <div>
          <strong>动画状态：</strong> <span id="animationStatus">待机</span>
        </div>
      </div>

      <div class="mascot-test-area">
        <div class="mascot-container" id="mascotContainer">
          <img
            class="mascot-image"
            id="mascotImage"
            src="/static/outfits/default-full.png"
            style="display: block"
          />
          <div
            class="lottie-container"
            id="lottieContainer"
            style="display: none"
          ></div>
        </div>
      </div>

      <div class="log" id="logContainer">
        <div class="log-entry log-info">测试页面已加载，等待操作...</div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <script>
      class MascotTester {
        constructor() {
          this.currentCharacterId = 1;
          this.isPlayingAnimation = false;
          this.lottieInstance = null;
          this.animationCache = {};

          // 角色配置
          this.characters = {
            1: {
              name: "默认",
              actionCount: 3,
              image: "/static/outfits/default-full.png",
            },
            2: {
              name: "夏装",
              actionCount: 2,
              image: "/static/outfits/summer-full.png",
            },
            3: {
              name: "冬装",
              actionCount: 4,
              image: "/static/outfits/winter-full.png",
            },
          };

          this.initializeElements();
          this.bindEvents();
          this.checkAvailableActions();
        }

        initializeElements() {
          this.characterSelect = document.getElementById("characterSelect");
          this.playAnimationBtn = document.getElementById("playAnimation");
          this.checkAnimationsBtn = document.getElementById("checkAnimations");
          this.clearCacheBtn = document.getElementById("clearCache");

          this.currentCharacterSpan =
            document.getElementById("currentCharacter");
          this.availableActionsSpan =
            document.getElementById("availableActions");
          this.animationStatusSpan = document.getElementById("animationStatus");

          this.mascotImage = document.getElementById("mascotImage");
          this.lottieContainer = document.getElementById("lottieContainer");
          this.logContainer = document.getElementById("logContainer");
        }

        bindEvents() {
          this.characterSelect.addEventListener("change", (e) => {
            this.switchCharacter(parseInt(e.target.value));
          });

          this.playAnimationBtn.addEventListener("click", () => {
            this.playRandomAnimation();
          });

          this.checkAnimationsBtn.addEventListener("click", () => {
            this.checkAvailableActions();
          });

          this.clearCacheBtn.addEventListener("click", () => {
            this.clearCache();
          });

          document
            .getElementById("mascotContainer")
            .addEventListener("click", () => {
              this.playRandomAnimation();
            });
        }

        log(message, type = "info") {
          const entry = document.createElement("div");
          entry.className = `log-entry log-${type}`;
          entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
          this.logContainer.appendChild(entry);
          this.logContainer.scrollTop = this.logContainer.scrollHeight;
        }

        switchCharacter(characterId) {
          this.log(
            `切换到角色 ${characterId} (${this.characters[characterId].name})`
          );
          this.currentCharacterId = characterId;
          this.currentCharacterSpan.textContent = `${characterId} (${this.characters[characterId].name})`;

          // 更新图片
          this.mascotImage.src = this.characters[characterId].image;

          // 检查新角色的可用动作
          this.checkAvailableActions();
        }

        async checkAvailableActions() {
          this.log(`检查角色 ${this.currentCharacterId} 的可用动画...`);
          this.availableActionsSpan.textContent = "检查中...";

          const character = this.characters[this.currentCharacterId];
          const cacheKey = `character_${this.currentCharacterId}`;

          // 检查缓存
          if (this.animationCache[cacheKey]) {
            this.log(
              `从缓存获取角色 ${
                this.currentCharacterId
              } 的动画: [${this.animationCache[cacheKey].join(", ")}]`
            );
            this.availableActionsSpan.textContent =
              this.animationCache[cacheKey].join(", ") || "无";
            return this.animationCache[cacheKey];
          }

          const availableActions = [];

          for (let i = 1; i <= character.actionCount; i++) {
            const animationPath = `/src/static/animations/${this.currentCharacterId}/${i}/data.json`;

            try {
              const response = await fetch(animationPath);
              if (response.ok) {
                const text = await response.text();
                if (text.trim() && text.trim() !== "") {
                  try {
                    const jsonData = JSON.parse(text);
                    if (jsonData && typeof jsonData === "object") {
                      availableActions.push(i);
                      this.log(`动画文件有效: ${animationPath}`, "info");
                    } else {
                      this.log(`动画文件 JSON 无效: ${animationPath}`, "warn");
                    }
                  } catch (parseError) {
                    this.log(
                      `动画文件 JSON 解析失败: ${animationPath}`,
                      "error"
                    );
                  }
                } else {
                  this.log(`动画文件为空: ${animationPath}`, "warn");
                }
              }
            } catch (error) {
              this.log(`动画文件访问失败: ${animationPath}`, "warn");
            }
          }

          // 缓存结果
          this.animationCache[cacheKey] = availableActions;
          this.availableActionsSpan.textContent =
            availableActions.join(", ") || "无";
          this.log(
            `角色 ${this.currentCharacterId} 可用动作: [${availableActions.join(
              ", "
            )}]`
          );

          return availableActions;
        }

        async playRandomAnimation() {
          if (this.isPlayingAnimation) {
            this.log("动画正在播放中，跳过", "warn");
            return;
          }

          const availableActions = await this.checkAvailableActions();

          if (availableActions.length === 0) {
            this.log(
              `角色 ${this.currentCharacterId} 没有可用的动画文件`,
              "error"
            );
            return;
          }

          const randomIndex = Math.floor(
            Math.random() * availableActions.length
          );
          const actionNumber = availableActions[randomIndex];

          this.log(
            `播放角色 ${this.currentCharacterId} 的动作 ${actionNumber}`
          );
          this.playLottieAnimation(actionNumber);
        }

        playLottieAnimation(actionNumber) {
          const animationPath = `/src/static/animations/${this.currentCharacterId}/${actionNumber}/data.json`;
          this.log(`开始播放 Lottie 动画: ${animationPath}`);

          this.isPlayingAnimation = true;
          this.animationStatusSpan.textContent = `播放动作 ${actionNumber}`;
          this.playAnimationBtn.disabled = true;

          // 显示 Lottie 容器，隐藏静态图片
          this.mascotImage.style.display = "none";
          this.lottieContainer.style.display = "block";

          try {
            // 清理之前的实例
            this.clearLottieInstance();

            // 创建新的 Lottie 实例
            this.lottieInstance = lottie.loadAnimation({
              container: this.lottieContainer,
              renderer: "svg",
              loop: false,
              autoplay: true,
              path: animationPath,
            });

            // 监听事件
            this.lottieInstance.addEventListener("complete", () => {
              this.log(`动画播放完成: ${animationPath}`, "info");
              this.onAnimationComplete();
            });

            this.lottieInstance.addEventListener("data_failed", () => {
              this.log(`动画加载失败: ${animationPath}`, "error");
              this.onAnimationComplete();
            });

            this.lottieInstance.addEventListener("data_ready", () => {
              this.log(`动画数据准备完成: ${animationPath}`, "info");
            });

            // 超时处理
            setTimeout(() => {
              if (this.isPlayingAnimation && this.lottieInstance) {
                this.log(`动画加载超时: ${animationPath}`, "warn");
                this.onAnimationComplete();
              }
            }, 5000);
          } catch (error) {
            this.log(`Lottie 播放错误: ${error.message}`, "error");
            this.onAnimationComplete();
          }
        }

        onAnimationComplete() {
          this.isPlayingAnimation = false;
          this.animationStatusSpan.textContent = "待机";
          this.playAnimationBtn.disabled = false;

          // 恢复静态图片
          this.lottieContainer.style.display = "none";
          this.mascotImage.style.display = "block";

          this.clearLottieInstance();
          this.log("动画播放结束，恢复静态状态");
        }

        clearLottieInstance() {
          if (this.lottieInstance) {
            this.lottieInstance.destroy();
            this.lottieInstance = null;
          }
        }

        clearCache() {
          this.animationCache = {};
          this.log("动画缓存已清除");
          this.checkAvailableActions();
        }
      }

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", () => {
        new MascotTester();
      });
    </script>
  </body>
</html>
