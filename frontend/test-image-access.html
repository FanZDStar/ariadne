<!DOCTYPE html>
<html>
  <head>
    <title>测试图片访问</title>
  </head>
  <body>
    <h2>测试动画图片访问</h2>

    <h3>人物2动作1图片测试</h3>
    <img
      src="/src/static/animations/2/1/images/seq_0_0.jpg"
      alt="seq_0_0"
      style="width: 100px"
      onerror="this.style.border='2px solid red'"
    />
    <img
      src="/src/static/animations/2/1/images/seq_0_1.jpg"
      alt="seq_0_1"
      style="width: 100px"
      onerror="this.style.border='2px solid red'"
    />
    <img
      src="/src/static/animations/2/1/images/seq_0_2.jpg"
      alt="seq_0_2"
      style="width: 100px"
      onerror="this.style.border='2px solid red'"
    />

    <h3>人物2动作2图片测试</h3>
    <img
      src="/src/static/animations/2/2/images/seq_0_0.jpg"
      alt="seq_0_0"
      style="width: 100px"
      onerror="this.style.border='2px solid red'"
    />
    <img
      src="/src/static/animations/2/2/images/seq_0_1.jpg"
      alt="seq_0_1"
      style="width: 100px"
      onerror="this.style.border='2px solid red'"
    />
    <img
      src="/src/static/animations/2/2/images/seq_0_2.jpg"
      alt="seq_0_2"
      style="width: 100px"
      onerror="this.style.border='2px solid red'"
    />

    <p>如果图片有红色边框，说明无法访问该路径</p>

    <script>
      console.log("测试图片路径访问...");

      // 测试fetch访问
      fetch("/src/static/animations/2/1/images/seq_0_0.jpg")
        .then((response) => {
          if (response.ok) {
            console.log("✅ 图片路径可以访问");
          } else {
            console.log("❌ 图片路径无法访问:", response.status);
          }
        })
        .catch((error) => {
          console.log("❌ 图片路径访问错误:", error);
        });
    </script>
  </body>
</html>
