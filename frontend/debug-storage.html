<!DOCTYPE html>
<html>
  <head>
    <title>调试存储状态</title>
  </head>
  <body>
    <h2>当前存储状态调试</h2>
    <div id="result"></div>

    <h3>操作</h3>
    <button onclick="checkStorage()">检查当前存储</button>
    <button onclick="setCharacter2()">设置为人物2</button>
    <button onclick="clearStorage()">清除存储</button>

    <script>
      function checkStorage() {
        const storage = localStorage.getItem("selectedOutfit");
        document.getElementById("result").innerHTML = `
                <h4>存储内容:</h4>
                <pre>${storage || "无存储"}</pre>
            `;
      }

      function setCharacter2() {
        const outfit = {
          id: 2,
          name: "红色裙装",
          mascotImage: "/static/outfits/red-dress.png",
        };
        localStorage.setItem("selectedOutfit", JSON.stringify(outfit));
        alert("已设置为人物2");
        checkStorage();
      }

      function clearStorage() {
        localStorage.removeItem("selectedOutfit");
        alert("已清除存储");
        checkStorage();
      }

      // 页面加载时检查
      checkStorage();
    </script>
  </body>
</html>
